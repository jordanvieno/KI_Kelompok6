name: Sync Backend to Hugging Face Space

on:
  push:
    branches: [main]
    # Hanya jalan kalau ada perubahan di folder server
    paths:
      - '03_Source_Code/server/**'

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Dibutuhkan untuk git subtree

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Pindahkan folder server ke folder sementara untuk membuat history git yang bersih
          cp -r 03_Source_Code/server /tmp/hf-deploy
          cd /tmp/hf-deploy
          
          # Inisialisasi Git baru, tambahkan file, dan commit
          git init -b main
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git commit -m "Deploy to Hugging Face"
          
          # Push secara paksa (force) ke branch main di Hugging Face
          git push --force https://JordanVieno:${HF_TOKEN}@huggingface.co/spaces/JordanVieno/BPKB-IPB-Backend main:main
